<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum Pro v4.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.2s; font-family: monospace; font-size: 13px; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 9px; color: #64748b; font-weight: bold; letter-spacing: 0.05em; }
        /* CSS para garantir que o modal comece invisível */
        #modalRateio { display: none !important; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

    <div id="modalRateio" class="items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl max-w-sm w-full">
            <h2 class="text-blue-400 font-bold uppercase text-[10px] mb-6 border-b border-slate-700 pb-2">Assistente de Rateio</h2>
            <div class="space-y-4">
                <div><label class="label-padrao">Frete Total Nota</label><input id="freteTotalNF" class="input" value="0,00" /></div>
                <div><label class="label-padrao">Valor Total Produtos</label><input id="valorTotalNF" class="input" value="0,00" /></div>
                <div class="flex gap-2 pt-4">
                    <button onclick="fecharRateio()" class="flex-1 bg-slate-700 py-3 rounded-xl text-[10px] font-bold uppercase">Sair</button>
                    <button onclick="aplicarRateio()" class="flex-1 bg-blue-600 py-3 rounded-xl text-[10px] font-bold uppercase">Ratear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">📈 Lucrum Pro <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded">v4.9</span></h1>
            <div id="statusSrv" class="px-4 py-1 bg-slate-800 rounded-full text-[10px] text-blue-400 font-mono border border-slate-700 uppercase">Online</div>
        </div>

        <div class="grid md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 text-slate-400 uppercase text-[10px] border-b border-slate-700 pb-2">📦 Entrada</h2>
                <div class="space-y-3">
                    <input id="codigo" class="input" placeholder="Referência" />
                    <input id="nome" class="input" placeholder="Descrição" />
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="label-padrao">Valor (R$)</label><input id="valor" class="input text-blue-400 font-bold" value="0,00" /></div>
                        <div><label class="label-padrao">IPI (%)</label><input id="ipi" class="input" value="0,00" /></div>
                    </div>
                    <div>
                        <label class="label-padrao">Frete Unit. (R$)</label>
                        <div class="flex gap-2">
                            <input id="frete" class="input" value="0,00" />
                            <button onclick="abrirRateio()" class="mt-1 bg-slate-700 px-3 rounded-lg hover:bg-blue-600">🚚</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 text-slate-400 uppercase text-[10px] border-b border-slate-700 pb-2">🧾 Fiscal (MG)</h2>
                <div class="space-y-2">
                    <label class="flex justify-between p-2 bg-slate-900/50 rounded text-[9px] font-bold uppercase">ST? <input type="checkbox" id="temST" onchange="toggleRegras()"></label>
                    <div id="campoMVA" class="hidden"><input id="mva" class="input" placeholder="MVA%" value="0,00"></div>
                    <label class="flex justify-between p-2 bg-slate-900/50 rounded text-[9px] font-bold uppercase">Redução? <input type="checkbox" id="temReducao" onchange="toggleRegras()"></label>
                    <div id="campoReducao" class="hidden"><input id="reducao" class="input" placeholder="Redução%" value="0,00"></div>
                    <label class="flex justify-between p-2 bg-slate-900/50 rounded text-[9px] font-bold text-orange-400 uppercase">Isento DIFAL? <input type="checkbox" id="isentoNCM"></label>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="inter" value="12,00" class="input text-center" />
                        <input id="intra" value="18,00" class="input text-center" />
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                <h2 class="mb-4 text-slate-400 uppercase text-[10px] border-b border-slate-700 pb-2">📊 Margem</h2>
                <label class="label-padrao">Simples Nacional (%)</label><input id="simples" class="input mb-4" value="0,00" />
                <label class="label-padrao">Margem de Contribuição (%)</label><input id="margem" class="input text-green-400 font-bold" value="0,00" />
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                <h2 class="mb-4 text-orange-400 uppercase text-[10px] border-b border-slate-700 pb-2">💳 Saída</h2>
                <label class="label-padrao">PIX (%)</label><input id="taxaVista" value="1,37" class="input text-center mb-4" />
                <label class="label-padrao">12x (%)</label><input id="taxa12x" value="12,40" class="input text-center" />
            </div>
        </div>

        <div class="mt-6 grid md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <span class="label-padrao">Parcelado 12x</span><p id="venda12x" class="text-4xl font-bold font-mono">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <span class="label-padrao text-green-500">À Vista / PIX</span><p id="vendaVista" class="text-4xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-blue-500/30 flex flex-col justify-between">
                <input type="password" id="senha" class="input text-center" placeholder="SENHA" />
                <button onclick="calcular()" class="mt-2 w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-black uppercase text-xs">Calcular</button>
            </div>
        </div>

        <div class="mt-6 bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-slate-900 text-slate-500 uppercase font-black">
                    <tr>
                        <th class="px-4 py-4">Produto</th>
                        <th class="px-4 py-4 text-right">Custo MG</th>
                        <th class="px-4 py-4 text-right text-orange-400">DIFAL/ST</th>
                        <th class="px-4 py-4 text-right text-blue-400">Lucro Liq</th>
                        <th class="px-4 py-4 text-right text-green-400">À Vista</th>
                        <th class="px-4 py-4 text-right">12x</th>
                        <th class="px-4 py-4 text-center">🗑️</th>
                    </tr>
                </thead>
                <tbody id="gridCorpo" class="divide-y divide-slate-700/50"></tbody>
            </table>
        </div>
    </div>

    <script>
        const parseBR = (v) => parseFloat(v.replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

        function abrirRateio() { document.getElementById('modalRateio').style.setProperty('display', 'flex', 'important'); }
        function fecharRateio() { document.getElementById('modalRateio').style.setProperty('display', 'none', 'important'); }
        
        function aplicarRateio() {
            const fT = parseBR(document.getElementById('freteTotalNF').value);
            const vT = parseBR(document.getElementById('valorTotalNF').value);
            const vU = parseBR(document.getElementById('valor').value);
            if (vT > 0) {
                document.getElementById('frete').value = formatBR((fT / vT) * vU);
                fecharRateio();
            }
        }

        function toggleRegras() {
            document.getElementById('campoMVA').classList.toggle('hidden', !document.getElementById('temST').checked);
            document.getElementById('campoReducao').classList.toggle('hidden', !document.getElementById('temReducao').checked);
        }

        async function calcular() {
            const status = document.getElementById('statusSrv');
            status.innerText = "...";
            const payload = {
                senha: document.getElementById('senha').value,
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                frete: parseBR(document.getElementById('frete').value),
                temST: document.getElementById('temST').checked,
                mva: parseBR(document.getElementById('mva').value),
                temReducao: document.getElementById('temReducao').checked,
                reducao: parseBR(document.getElementById('reducao').value),
                isentoNCM: document.getElementById('isentoNCM').checked,
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('taxaVista').value),
                taxa12x: parseBR(document.getElementById('taxa12x').value)
            };

            const response = await fetch('https://lucrum-api.onrender.com/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.status === 401) { alert("Senha Errada"); return; }
            const res = await response.json();
            if (res.sucesso) {
                document.getElementById('vendaVista').innerText = "R$ " + formatBR(res.precoVista);
                document.getElementById('venda12x').innerText = "R$ " + formatBR(res.preco12x);
                status.innerText = "ONLINE";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-3"><b>${document.getElementById('nome').value}</b></td>
                    <td class="px-4 py-3 text-right font-mono italic">R$ ${formatBR(res.custoTotalMG)}</td>
                    <td class="px-4 py-3 text-right font-mono text-orange-400">R$ ${formatBR(res.impostoFinal)}</td>
                    <td class="px-4 py-3 text-right font-mono text-blue-400">R$ ${formatBR(res.lucroAlvo)}</td>
                    <td class="px-4 py-3 text-right text-green-400 font-bold font-mono">R$ ${formatBR(res.precoVista)}</td>
                    <td class="px-4 py-3 text-right font-bold font-mono">R$ ${formatBR(res.preco12x)}</td>
                    <td class="px-4 py-3 text-center"><button onclick="this.closest('tr').remove()" class="text-slate-500 hover:text-red-500">🗑️</button></td>
                `;
                document.getElementById('gridCorpo').prepend(tr);
            }
        }

        document.querySelectorAll('input').forEach(i => {
            i.addEventListener('input', (e) => {
                if (['codigo', 'nome', 'senha'].includes(i.id)) return;
                let v = e.target.value.replace(/\D/g, '');
                e.target.value = (v / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            });
        });
    </script>
</body>
</html>
