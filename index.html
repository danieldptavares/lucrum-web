<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum V4.3 - Ventitre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.2s; font-family: monospace; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 10px; color: #94a3b8; font-weight: bold; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans" oncontextmenu="return false;">

    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
            <span class="text-blue-500">📈</span> Lucrum Pro <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded">V4.3 - Protegido</span>
        </h1>

        <div class="grid md:grid-cols-4 gap-6">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">📦 Produto</h2>
                <div class="mb-3"><label class="label-padrao">Cód. Referência</label><input id="codigo" class="input" /></div>
                <div class="mb-3"><label class="label-padrao">Nome do Produto</label><input id="nome" class="input" /></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="label-padrao">Valor (R$)</label><input id="valor" class="input" /></div>
                    <div><label class="label-padrao">IPI (%)</label><input id="ipi" class="input" /></div>
                </div>
                <div class="mt-3"><label class="label-padrao">Frete (R$)</label><input id="frete" class="input" /></div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">🧾 Impostos</h2>
                <div class="space-y-3">
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded text-[10px] font-bold">
                        <span>ICMS-ST?</span>
                        <input type="checkbox" id="temST" onchange="toggleRegras()" class="w-4 h-4 accent-blue-500" />
                    </label>
                    <div id="campoMVA" class="hidden"><label class="label-padrao text-blue-400">MVA (%)</label><input id="mva" class="input" /></div>
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded text-[10px] font-bold">
                        <span>Redução?</span>
                        <input type="checkbox" id="temReducao" onchange="toggleRegras()" class="w-4 h-4 accent-blue-500" />
                    </label>
                    <div id="campoReducao" class="hidden"><label class="label-padrao text-blue-400">Redução (%)</label><input id="reducao" class="input" /></div>
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded text-[10px] font-bold text-orange-400">
                        <span>Isento DIFAL?</span>
                        <input type="checkbox" id="isentoNCM" class="w-4 h-4 accent-orange-500" />
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="label-padrao">ICMS Orig</label><input id="inter" value="12,00" class="input text-center" /></div>
                        <div><label class="label-padrao">ICMS Dest</label><input id="intra" value="18,00" class="input text-center" /></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">📊 Margem & Acesso</h2>
                <div class="mb-3"><label class="label-padrao">Simples (%)</label><input id="simples" class="input" /></div>
                <div class="mb-3"><label class="label-padrao">Margem (%)</label><input id="margem" class="input" /></div>
                <div class="mt-4"><label class="label-padrao text-yellow-500 font-bold">Chave de Acesso</label><input type="password" id="senha" class="input border-yellow-900/40" placeholder="****" /></div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-orange-400 uppercase text-xs border-b border-slate-700 pb-2">💳 Taxas</h2>
                <div class="mb-4"><label class="label-padrao">À Vista (%)</label><input id="taxaVista" value="1,37" class="input" /></div>
                <div class="mb-4"><label class="label-padrao">12x (%)</label><input id="taxa12x" value="12,40" class="input" /></div>
                <div id="statusSrv" class="p-2 bg-blue-500/10 rounded text-[10px] text-blue-400 font-bold uppercase text-center">Aguardando...</div>
            </div>
        </div>

        <div class="mt-8 grid md:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <h3 class="text-slate-500 font-bold uppercase text-[10px]">Preço 12x</h3>
                <p id="venda12x" class="text-4xl font-bold">R$ 0,00</p>
                <p id="lucro12x" class="text-xs text-slate-400 mt-1">Lucro: R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-green-500/30 text-center">
                <h3 class="text-green-500 font-bold uppercase text-[10px]">Preço À Vista</h3>
                <p id="vendaVista" class="text-4xl font-bold text-green-400">R$ 0,00</p>
                <button onclick="calcular()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl uppercase text-xs shadow-lg">Calcular</button>
            </div>
        </div>

        <div class="mt-8 bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900/50 text-slate-500 uppercase">
                    <tr><th class="px-4 py-3">Ref</th><th class="px-4 py-3">Produto</th><th class="px-4 py-3 text-right">À Vista</th><th class="px-4 py-3 text-right">12x</th><th class="px-4 py-3"></th></tr>
                </thead>
                <tbody id="gridCorpo" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        const parseBR = (v) => parseFloat((v || '').replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function toggleRegras() {
            document.getElementById('campoMVA').classList.toggle('hidden', !document.getElementById('temST').checked);
            document.getElementById('campoReducao').classList.toggle('hidden', !document.getElementById('temReducao').checked);
        }

        async function calcular() {
            const status = document.getElementById('statusSrv');
            status.innerText = "Processando...";
            
            const payload = {
                senha: document.getElementById('senha').value,
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                frete: parseBR(document.getElementById('frete').value),
                temST: document.getElementById('temST').checked,
                mva: parseBR(document.getElementById('mva').value),
                temReducao: document.getElementById('temReducao').checked,
                reducao: parseBR(document.getElementById('reducao').value),
                isentoNCM: document.getElementById('isentoNCM').checked,
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('taxaVista').value),
                taxa12x: parseBR(document.getElementById('taxa12x').value)
            };

            try {
                // SUBSTITUA PELA SUA URL DO RENDER ABAIXO
                const response = await fetch('https://SUA_API_NO_RENDER.onrender.com/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const res = await response.json();
                
                if (response.status === 401) {
                    alert("Acesso Negado: Senha Incorreta!");
                    status.innerText = "Erro: Senha";
                    return;
                }

                if (res.sucesso) {
                    document.getElementById('vendaVista').innerText = "R$ " + formatBR(res.precoVista);
                    document.getElementById('venda12x').innerText = "R$ " + formatBR(res.preco12x);
                    document.getElementById('lucro12x').innerText = "Lucro: R$ " + formatBR(res.lucroReal);
                    status.innerText = "OK!";
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td class="px-4 py-3 text-slate-500">${document.getElementById('codigo').value}</td><td class="px-4 py-3 font-bold">${document.getElementById('nome').value}</td><td class="px-4 py-3 text-right text-green-400 font-bold">R$ ${formatBR(res.precoVista)}</td><td class="px-4 py-3 text-right font-bold">R$ ${formatBR(res.preco12x)}</td><td class="px-4 py-3 text-center"><button onclick="this.closest('tr').remove()">✕</button></td>`;
                    document.getElementById('gridCorpo').prepend(tr);
                }
            } catch (e) { status.innerText = "Erro de Conexão"; }
        }

        function mask(i) {
            i.addEventListener('input', (e) => {
                if (i.id === 'codigo' || i.id === 'nome' || i.id === 'senha') return;
                let v = e.target.value.replace(/\D/g, '');
                v = (v / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                e.target.value = v;
            });
        }
        document.querySelectorAll('input').forEach(mask);
    </script>
</body>
</html>
