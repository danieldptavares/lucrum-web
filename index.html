<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum Pro - Ventitre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.2s; font-family: monospace; font-size: 13px; }
        .input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 9px; color: #64748b; font-weight: bold; letter-spacing: 0.05em; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        body { user-select: text !important; -webkit-user-select: text !important; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

    <div class="max-w-7xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
            <span class="text-blue-500">📈</span> Lucrum Pro <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded font-mono">v4.5</span>
        </h1>

        <div class="grid md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-700/50 pb-2">📦 Entrada</h2>
                <div class="space-y-3">
                    <div><label class="label-padrao">Referência</label><input id="codigo" class="input" /></div>
                    <div><label class="label-padrao">Descrição</label><input id="nome" class="input" /></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="label-padrao">Valor (R$)</label><input id="valor" class="input text-blue-400 font-bold" value="0,00" /></div>
                        <div><label class="label-padrao">IPI (%)</label><input id="ipi" class="input" value="0,00" /></div>
                    </div>
                    <div><label class="label-padrao">Frete (R$)</label><input id="frete" class="input" value="0,00" /></div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-700/50 pb-2">🧾 Fiscal (MG)</h2>
                <div class="space-y-2">
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 cursor-pointer hover:bg-slate-900 transition-all text-[10px] font-bold uppercase tracking-tight">
                        <span>ICMS-ST?</span>
                        <input type="checkbox" id="temST" onchange="toggleRegras()" class="w-4 h-4 accent-blue-500" />
                    </label>
                    <div id="campoMVA" class="hidden"><label class="label-padrao text-blue-400">MVA (%)</label><input id="mva" class="input border-blue-900/30" value="0,00" /></div>
                    
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 cursor-pointer hover:bg-slate-900 transition-all text-[10px] font-bold uppercase tracking-tight">
                        <span>Redução?</span>
                        <input type="checkbox" id="temReducao" onchange="toggleRegras()" class="w-4 h-4 accent-blue-500" />
                    </label>
                    <div id="campoReducao" class="hidden"><label class="label-padrao text-blue-400">Redução (%)</label><input id="reducao" class="input border-blue-900/30" value="0,00" /></div>

                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-orange-900/20 cursor-pointer text-[10px] font-bold uppercase tracking-tight text-orange-400">
                        <span>Isento DIFAL?</span>
                        <input type="checkbox" id="isentoNCM" class="w-4 h-4 accent-orange-500" />
                    </label>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div><label class="label-padrao">Inter (Orig)</label><input id="inter" value="12,00" class="input text-center" /></div>
                        <div><label class="label-padrao">Intra (Dest)</label><input id="intra" value="18,00" class="input text-center" /></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-700/50 pb-2">📊 Margem Alvo</h2>
                <div class="space-y-4">
                    <div><label class="label-padrao">Simples Nacional (%)</label><input id="simples" class="input" value="0,00" /></div>
                    <div><label class="label-padrao">Margem Desejada (%)</label><input id="margem" class="input text-green-400 font-bold" value="0,00" /></div>
                    <div id="statusSrv" class="mt-4 p-3 bg-slate-900 rounded-xl text-[9px] text-blue-400 font-mono text-center border border-slate-700 italic uppercase">Servidor Pronto</div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl text-center">
                <h2 class="mb-4 font-semibold text-orange-400 uppercase text-[10px] tracking-wider border-b border-slate-700/50 pb-2">💳 Meios de Saída</h2>
                <div class="space-y-4">
                    <div><label class="label-padrao">À Vista / PIX (%)</label><input id="taxaVista" value="1,37" class="input text-center" /></div>
                    <div><label class="label-padrao">Cartão 12x (%)</label><input id="taxa12x" value="12,40" class="input text-center" /></div>
                </div>
            </div>
        </div>

        <div class="mt-6 grid md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center flex flex-col justify-center">
                <h3 class="text-slate-500 font-bold uppercase text-[9px] tracking-widest mb-1">Parcelado 12x</h3>
                <p id="venda12x" class="text-4xl font-bold text-slate-100 font-mono">R$ 0,00</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center flex flex-col justify-center">
                <h3 class="text-green-500 font-bold uppercase text-[9px] tracking-widest mb-1">À Vista / PIX</h3>
                <p id="vendaVista" class="text-4xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-blue-500/30 flex flex-col justify-between shadow-2xl">
                <div>
                    <label class="label-padrao text-blue-400 mb-1">Chave de Acesso</label>
                    <input type="password" id="senha" class="input border-blue-900/40" placeholder="Digite sua senha..." />
                </div>
                <button onclick="calcular()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl uppercase text-xs tracking-widest transition-all shadow-lg active:scale-95">Executar Cálculo</button>
            </div>
        </div>

        <div class="mt-6 bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-slate-900 text-slate-500 uppercase font-black tracking-tighter">
                    <tr>
                        <th class="px-4 py-3">Ref</th>
                        <th class="px-4 py-3">Produto</th>
                        <th class="px-4 py-3 text-right">Custo MG</th>
                        <th class="px-4 py-3 text-right">Imposto (DIFAL/ST)</th>
                        <th class="px-4 py-3 text-right text-blue-400">Lucro Líquido</th>
                        <th class="px-4 py-3 text-right text-green-400">À Vista</th>
                        <th class="px-4 py-3 text-right">12x</th>
                        <th class="px-4 py-3 w-10"></th>
                    </tr>
                </thead>
                <tbody id="gridCorpo" class="divide-y divide-slate-700/50"></tbody>
            </table>
        </div>
    </div>

    <script>
        const parseBR = (v) => parseFloat((v || '').replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function toggleRegras() {
            document.getElementById('campoMVA').classList.toggle('hidden', !document.getElementById('temST').checked);
            document.getElementById('campoReducao').classList.toggle('hidden', !document.getElementById('temReducao').checked);
        }

        async function calcular() {
            const status = document.getElementById('statusSrv');
            status.innerText = "PROCESSANDO...";
            
            const payload = {
                senha: document.getElementById('senha').value,
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                frete: parseBR(document.getElementById('frete').value),
                temST: document.getElementById('temST').checked,
                mva: parseBR(document.getElementById('mva').value),
                temReducao: document.getElementById('temReducao').checked,
                reducao: parseBR(document.getElementById('reducao').value),
                isentoNCM: document.getElementById('isentoNCM').checked,
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('taxaVista').value),
                taxa12x: parseBR(document.getElementById('taxa12x').value)
            };

            try {
                const response = await fetch('https://lucrum-api.onrender.com/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const res = await response.json();
                
                if (response.status === 401) {
                    alert("SENHA INCORRETA");
                    status.innerText = "ERRO SENHA";
                    return;
                }

                if (res.sucesso) {
                    document.getElementById('vendaVista').innerText = "R$ " + formatBR(res.precoVista);
                    document.getElementById('venda12x').innerText = "R$ " + formatBR(res.preco12x);
                    status.innerText = "CÁLCULO CONCLUÍDO";
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-700/30 transition-colors";
                    tr.innerHTML = `
                        <td class="px-4 py-3 text-slate-500 font-mono">${document.getElementById('codigo').value || '-'}</td>
                        <td class="px-4 py-3 font-bold text-slate-300 uppercase">${document.getElementById('nome').value || 'S/N'}</td>
                        <td class="px-4 py-3 text-right font-mono italic">R$ ${formatBR(res.custoFinalMG)}</td>
                        <td class="px-4 py-3 text-right font-mono text-orange-400">R$ ${formatBR(res.impostoEntrada)}</td>
                        <td class="px-4 py-3 text-right font-mono text-blue-400 font-bold">R$ ${formatBR(res.lucroReal)}</td>
                        <td class="px-4 py-3 text-right text-green-400 font-bold font-mono">R$ ${formatBR(res.precoVista)}</td>
                        <td class="px-4 py-3 text-right font-bold font-mono">R$ ${formatBR(res.preco12x)}</td>
                        <td class="px-4 py-3 text-center"><button onclick="this.closest('tr').remove()" class="text-slate-600 hover:text-red-500">✕</button></td>
                    `;
                    document.getElementById('gridCorpo').prepend(tr);
                }
            } catch (e) { status.innerText = "ERRO CONEXÃO"; }
        }

        function mask(i) {
            i.addEventListener('input', (e) => {
                if (['codigo', 'nome', 'senha'].includes(i.id)) return;
                let v = e.target.value.replace(/\D/g, '');
                v = (v / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                e.target.value = v;
            });
        }
        document.querySelectorAll('input').forEach(mask);
    </script>
</body>
</html>
