<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum Pro v4.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.2s; font-family: monospace; font-size: 13px; }
        .input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 9px; color: #64748b; font-weight: bold; letter-spacing: 0.05em; }
        body { user-select: text !important; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">📈 Lucrum Pro <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded">v4.9</span></h1>
            <div id="statusSrv" class="px-4 py-1 bg-slate-800 rounded-full text-[10px] text-blue-400 font-mono border border-slate-700 uppercase">Servidor Online</div>
        </div>

        <div class="grid md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-[10px] border-b border-slate-700/50 pb-2">📦 Entrada</h2>
                <div class="space-y-3">
                    <div><label class="label-padrao">Referência</label><input id="codigo" class="input" /></div>
                    <div><label class="label-padrao">Descrição</label><input id="nome" class="input" /></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="label-padrao">Valor (R$)</label><input id="valor" class="input text-blue-400 font-bold" value="0,00" /></div>
                        <div><label class="label-padrao">IPI (%)</label><input id="ipi" class="input" value="0,00" /></div>
                    </div>
                    <div><label class="label-padrao">Frete Rateado (R$)</label><input id="frete" class="input" value="0,00" /></div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-[10px] border-b border-slate-700/50 pb-2">🧾 Fiscal (MG)</h2>
                <div class="space-y-2">
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 cursor-pointer text-[10px] font-bold uppercase">
                        <span>ICMS-ST?</span>
                        <input type="checkbox" id="temST" onchange="toggleRegras()" class="w-4 h-4 accent-blue-500" />
                    </label>
                    <div id="campoMVA" class="hidden"><label class="label-padrao text-blue-400">MVA (%)</label><input id="mva" class="input border-blue-900/30" value="0,00" /></div>
                    
                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 cursor-pointer text-[10px] font-bold uppercase">
                        <span>Redução BC?</span>
                        <input type="checkbox" id="temReducao" onchange="toggleRegras()" class="w-4 h-4 accent-blue-500" />
                    </label>
                    <div id="campoReducao" class="hidden"><label class="label-padrao text-blue-400">Redução (%)</label><input id="reducao" class="input border-blue-900/30" value="0,00" /></div>

                    <label class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg border border-orange-900/20 cursor-pointer text-[10px] font-bold text-orange-400 uppercase">
                        <span>Isento DIFAL?</span>
                        <input type="checkbox" id="isentoNCM" class="w-4 h-4 accent-orange-500" />
                    </label>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div><label class="label-padrao">Inter (Orig)</label><input id="inter" value="12,00" class="input text-center" /></div>
                        <div><label class="label-padrao">Intra (Dest)</label><input id="intra" value="18,00" class="input text-center" /></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-[10px] border-b border-slate-700/50 pb-2">📊 Margem</h2>
                <div class="space-y-4">
                    <div><label class="label-padrao">Simples Nacional (%)</label><input id="simples" class="input" value="0,00" /></div>
                    <div><label class="label-padrao">Margem de Contribuição (%)</label><input id="margem" class="input text-green-400 font-bold" value="0,00" /></div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl text-center">
                <h2 class="mb-4 font-semibold text-orange-400 uppercase text-[10px] border-b border-slate-700/50 pb-2">💳 Saída</h2>
                <div class="space-y-4">
                    <div><label class="label-padrao">À Vista / PIX (%)</label><input id="taxaVista" value="1,37" class="input text-center" /></div>
                    <div><label class="label-padrao">Cartão 12x (%)</label><input id="taxa12x" value="12,40" class="input text-center" /></div>
                </div>
            </div>
        </div>

        <div class="mt-6 grid md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <span class="label-padrao mb-1">Parcelado 12x</span>
                <p id="venda12x" class="text-4xl font-bold font-mono">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <span class="label-padrao text-green-500 mb-1">À Vista / PIX</span>
                <p id="vendaVista" class="text-4xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-blue-500/30 flex flex-col justify-between">
                <div>
                    <label class="label-padrao text-blue-400">Chave de Acesso</label>
                    <input type="password" id="senha" class="input" placeholder="****" />
                </div>
                <button onclick="calcular()" class="mt-3 w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl uppercase text-xs transition-all">Calcular</button>
            </div>
        </div>

        <div class="mt-6 bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-slate-900 text-slate-500 uppercase font-black">
                    <tr>
                        <th class="px-4 py-4">Ref</th>
                        <th class="px-4 py-4">Produto</th>
                        <th class="px-4 py-4 text-right">Custo Total MG</th>
                        <th class="px-4 py-4 text-right text-orange-400">DIFAL/ST</th>
                        <th class="px-4 py-4 text-right text-blue-400">Lucro Líquido</th>
                        <th class="px-4 py-4 text-right text-green-400">À Vista</th>
                        <th class="px-4 py-4 text-right">12x</th>
                        <th class="px-4 py-4 w-12 text-center">🗑️</th>
                    </tr>
                </thead>
                <tbody id="gridCorpo" class="divide-y divide-slate-700/50"></tbody>
            </table>
        </div>
    </div>

    <script>
        const parseBR = (v) => parseFloat(v.replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

        function toggleRegras() {
            document.getElementById('campoMVA').classList.toggle('hidden', !document.getElementById('temST').checked);
            document.getElementById('campoReducao').classList.toggle('hidden', !document.getElementById('temReducao').checked);
        }

        async function calcular() {
            const status = document.getElementById('statusSrv');
            status.innerText = "CALCULANDO...";
            
            const payload = {
                senha: document.getElementById('senha').value,
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                frete: parseBR(document.getElementById('frete').value),
                temST: document.getElementById('temST').checked,
                mva: parseBR(document.getElementById('mva').value),
                temReducao: document.getElementById('temReducao').checked,
                reducao: parseBR(document.getElementById('reducao').value),
                isentoNCM: document.getElementById('isentoNCM').checked,
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('taxaVista').value),
                taxa12x: parseBR(document.getElementById('taxa12x').value)
            };

            try {
                const response = await fetch('https://lucrum-api.onrender.com/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                if (response.status === 401) { alert("Senha Errada"); return; }

                if (res.sucesso) {
                    document.getElementById('vendaVista').innerText = "R$ " + formatBR(res.precoVista);
                    document.getElementById('venda12x').innerText = "R$ " + formatBR(res.preco12x);
                    status.innerText = "ONLINE";

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-700/30 transition-colors";
                    tr.innerHTML = `
                        <td class="px-4 py-3 text-slate-500 font-mono">${document.getElementById('codigo').value || '-'}</td>
                        <td class="px-4 py-3 font-bold uppercase">${document.getElementById('nome').value || 'S/N'}</td>
                        <td class="px-4 py-3 text-right font-mono italic">R$ ${formatBR(res.custoTotalMG)}</td>
                        <td class="px-4 py-3 text-right font-mono text-orange-400">R$ ${formatBR(res.impostoFinal)}</td>
                        <td class="px-4 py-3 text-right font-mono text-blue-400 font-bold">R$ ${formatBR(res.lucroAlvo)}</td>
                        <td class="px-4 py-3 text-right text-green-400 font-bold font-mono">R$ ${formatBR(res.precoVista)}</td>
                        <td class="px-4 py-3 text-right font-bold font-mono">R$ ${formatBR(res.preco12x)}</td>
                        <td class="px-4 py-3 text-center">
                            <button onclick="this.closest('tr').remove()" class="text-slate-500 hover:text-red-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </td>
                    `;
                    document.getElementById('gridCorpo').prepend(tr);
                }
            } catch (e) { status.innerText = "ERRO CONEXÃO"; }
        }

        function mask(i) {
            i.addEventListener('input', (e) => {
                if (['codigo', 'nome', 'senha'].includes(i.id)) return;
                let v = e.target.value.replace(/\D/g, '');
                v = (v / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                e.target.value = v;
            });
        }
        document.querySelectorAll('input').forEach(mask);
    </script>
</body>
</html>
