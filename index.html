<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum Pro - Ventitre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; color: white; font-family: monospace; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 10px; color: #94a3b8; font-weight: bold; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        /* Impede seleção de texto para dificultar cópia */
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans" oncontextmenu="return false;">

    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
            <span class="text-blue-500">📈</span> Lucrum Pro <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-uppercase">V4.3 - Protegido</span>
        </h1>

        <div class="grid md:grid-cols-4 gap-6">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">📦 Produto</h2>
                <div class="mb-3">
                    <label class="label-padrao">Cód. Referência</label>
                    <input id="codigo" placeholder="001" class="input" />
                </div>
                <div class="mb-3">
                    <label class="label-padrao">Nome do Produto</label>
                    <input id="nome" placeholder="Produto..." class="input" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="label-padrao">Valor (R$)</label><input id="valor" placeholder="0,00" class="input" /></div>
                    <div><label class="label-padrao">IPI (%)</label><input id="ipi" placeholder="0,00" class="input" /></div>
                </div>
                <div class="mt-3">
                    <label class="label-padrao">Frete (R$)</label>
                    <input id="frete" placeholder="0,00" class="input" />
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">🧾 Impostos (MG)</h2>
                <div class="space-y-4">
                    <div><label class="label-padrao">ICMS Origem</label><input id="inter" value="12,00" class="input text-center" /></div>
                    <div><label class="label-padrao">ICMS Destino</label><input id="intra" value="18,00" class="input text-center" /></div>
                    <div class="p-3 bg-slate-900 rounded-lg text-center">
                        <span class="text-[10px] text-slate-500 uppercase">Status do Cálculo</span>
                        <div id="statusCalculo" class="text-blue-400 font-bold text-xs">Aguardando...</div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">📊 Margem</h2>
                <div class="mb-4">
                    <label class="label-padrao">Simples Nacional (%)</label>
                    <input id="simples" placeholder="0,00" class="input" />
                </div>
                <div class="mb-4">
                    <label class="label-padrao">Margem Lucro (%)</label>
                    <input id="margem" placeholder="0,00" class="input" />
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-orange-400 uppercase text-xs border-b border-slate-700 pb-2">💳 Taxas</h2>
                <div class="mb-4"><label class="label-padrao">Débito/Pix (%)</label><input id="taxaVista" value="1,37" class="input" /></div>
                <div class="mb-4"><label class="label-padrao">Crédito 12x (%)</label><input id="taxa12x" value="12,40" class="input" /></div>
            </div>
        </div>

        <div class="mt-8 grid md:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 text-center">
                <h3 class="text-slate-500 font-bold uppercase text-xs mb-4">Preço 12x (Tabela)</h3>
                <p id="venda12x" class="text-5xl font-bold text-white italic">R$ 0,00</p>
                <div class="mt-4 pt-4 border-t border-slate-700/50">
                    <span class="text-[10px] text-slate-500 uppercase font-bold">Lucro Blindado (12x)</span>
                    <p id="lucro12x" class="text-xl font-mono text-slate-300 font-bold">R$ 0,00</p>
                </div>
            </div>
            <div class="bg-slate-900 p-8 rounded-3xl border-2 border-green-500/30 text-center shadow-2xl">
                <h3 class="text-green-500 font-bold uppercase text-xs mb-4">Preço À Vista</h3>
                <p id="vendaVista" class="text-5xl font-bold text-green-400 italic">R$ 0,00</p>
                <div class="mt-4 pt-4 border-t border-green-900/30">
                    <span class="text-[10px] text-green-600 uppercase font-bold">Lucro Blindado (À Vista)</span>
                    <p id="lucroVista" class="text-2xl font-bold text-green-500 font-mono">R$ 0,00</p>
                </div>
                <button onclick="chamarCalculoRemoto()" class="mt-6 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all uppercase tracking-widest text-sm shadow-lg">Calcular com Segurança</button>
            </div>
        </div>
    </div>

    <script>
        // Bloqueio básico de teclado (F12, Ctrl+U, Ctrl+Shift+I)
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73 || e.keyCode == 83))) {
                return false;
            }
        };

        const parseBR = (v) => parseFloat((v || '').replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        async function chamarCalculoRemoto() {
            const status = document.getElementById('statusCalculo');
            status.innerText = "Processando...";
            status.className = "text-yellow-400 font-bold text-xs";

            const dados = {
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                frete: parseBR(document.getElementById('frete').value),
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('taxaVista').value),
                taxa12x: parseBR(document.getElementById('taxa12x').value)
            };

            try {
                // SUBSTITUA A URL ABAIXO PELA URL QUE O RENDER TE DER
                const response = await fetch('https://lucrum-api.onrender.com/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const res = await response.json();

                if (res.sucesso) {
                    document.getElementById('vendaVista').innerText = "R$ " + formatBR(res.precoVista);
                    document.getElementById('venda12x').innerText = "R$ " + formatBR(res.preco12x);
                    document.getElementById('lucroVista').innerText = "R$ " + formatBR(res.lucroReal);
                    document.getElementById('lucro12x').innerText = "R$ " + formatBR(res.lucroReal);
                    status.innerText = "Calculado";
                    status.className = "text-green-400 font-bold text-xs";
                }
            } catch (err) {
                status.innerText = "Erro na Conexão";
                status.className = "text-red-400 font-bold text-xs";
                console.error("Erro ao acessar o servidor remoto.");
            }
        }

        // Máscara de moeda simples (igual ao anterior)
        function aplicarMascara(i) {
            i.addEventListener('input', (e) => {
                if (i.id === 'codigo' || i.id === 'nome') return;
                let v = e.target.value.replace(/\D/g, '');
                v = (v / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                e.target.value = v;
            });
        }
        document.querySelectorAll('input').forEach(aplicarMascara);
    </script>
</body>
</html>
