<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum Pro V4.4 - Ventitre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reduzido o padding para tornar os campos mais compactos, logo acima dos dígitos */
        .input { width: 100%; padding: 5px 8px; margin-top: 4px; border-radius: 6px; background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.2s; font-family: monospace; font-size: 13px; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 10px; color: #94a3b8; font-weight: bold; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans" oncontextmenu="return false;">

    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-5 flex items-center gap-2">
            <span class="text-blue-500">📈</span> Lucrum Pro <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded">V4.4 - Protegido</span>
        </h1>

        <div class="grid md:grid-cols-2 gap-6">
            
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 font-semibold text-slate-400 uppercase text-xs border-b border-slate-700 pb-2">📦 Entrada da Mercadoria</h2>
                
                <div class="mb-2"><label class="label-padrao">Cód. Referência</label><input id="codigo" class="input" /></div>
                <div class="mb-3"><label class="label-padrao">Nome do Produto</label><input id="nome" class="input" /></div>
                
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div><label class="label-padrao">Valor (R$)</label><input id="valor" class="input text-left" placeholder="0,00" /></div>
                    <div><label class="label-padrao">IPI (%)</label><input id="ipi" class="input text-center" placeholder="0,00" /></div>
                    <div><label class="label-padrao">Frete Entrada (R$)</label><input id="freteEntrada" class="input text-left" placeholder="0,00" /></div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-700/50">
                    <div>
                        <label class="flex justify-between items-center bg-slate-900/50 p-1.5 rounded text-[10px] font-bold mb-1.5">
                            <span>ICMS-ST?</span>
                            <input type="checkbox" id="temST" onchange="toggleRegras()" class="w-3.5 h-3.5 accent-blue-500" />
                        </label>
                        <label class="label-padrao text-blue-400">MVA (%)</label>
                        <input id="mva" class="input" disabled style="opacity: 0.4;" placeholder="0,00" />
                    </div>
                    
                    <div>
                        <label class="flex justify-between items-center bg-slate-900/50 p-1.5 rounded text-[10px] font-bold mb-1.5">
                            <span>Redução Base?</span>
                            <input type="checkbox" id="temReducao" onchange="toggleRegras()" class="w-3.5 h-3.5 accent-blue-500" />
                        </label>
                        <label class="label-padrao text-blue-400">Redução (%)</label>
                        <input id="reducao" class="input" disabled style="opacity: 0.4;" placeholder="0,00" />
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <div><label class="label-padrao">ICMS Orig</label><input id="inter" value="12,00" class="input text-center" /></div>
                    <div><label class="label-padrao">ICMS Dest</label><input id="intra" value="18,00" class="input text-center" /></div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="mb-4 font-semibold text-orange-400 uppercase text-xs border-b border-slate-700 pb-2">💳 Saída</h2>
                    
                    <div class="mb-3"><label class="label-padrao text-orange-400">Frete Saída (R$)</label><input id="freteSaida" class="input border-orange-900/40" placeholder="0,00" /></div>
                    <div class="mb-3"><label class="label-padrao">Simples Nacional (%)</label><input id="simples" class="input" placeholder="0,00" /></div>
                    <div class="mb-3"><label class="label-padrao">Margem de Contribuição (%)</label><input id="margem" class="input" placeholder="0,00" /></div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div><label class="label-padrao">Taxa À Vista (%)</label><input id="taxaVista" value="1,37" class="input" /></div>
                        <div><label class="label-padrao">Taxa 12x (%)</label><input id="taxa12x" value="12,40" class="input" /></div>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-slate-700/50">
                    <label class="label-padrao text-yellow-500 font-bold">Chave de Acesso</label>
                    <input type="password" id="senha" class="input border-yellow-900/40 mb-3" placeholder="****" />
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="calcular()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg uppercase text-xs shadow-lg transition-all">Calcular</button>
                        <div id="statusSrv" class="w-full py-2 bg-blue-500/10 rounded-lg text-[10px] text-blue-400 font-bold uppercase text-center border border-blue-500/20 flex items-center justify-center">Aguardando...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 grid md:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                <h3 class="text-slate-500 font-bold uppercase text-[10px]">Preço 12x</h3>
                <p id="venda12x" class="text-3xl font-bold">R$ 0,00</p>
                <p id="lucro12x" class="text-xs text-slate-400 mt-0.5">Lucro: R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                <h3 class="text-green-500 font-bold uppercase text-[10px]">Preço À Vista</h3>
                <p id="vendaVista" class="text-3xl font-bold text-green-400">R$ 0,00</p>
                <p class="text-xs text-slate-500 mt-0.5">Pagamento Direto</p>
            </div>
        </div>

        <div class="mt-6 bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900/50 text-slate-500 uppercase">
                    <tr><th class="px-4 py-2.5">Ref</th><th class="px-4 py-2.5">Produto</th><th class="px-4 py-2.5 text-right">À Vista</th><th class="px-4 py-2.5 text-right">12x</th><th class="px-4 py-2.5"></th></tr>
                </thead>
                <tbody id="gridCorpo" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        const parseBR = (v) => parseFloat((v || '').replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function toggleRegras() {
            const temST = document.getElementById('temST').checked;
            const temReducao = document.getElementById('temReducao').checked;
            
            const mva = document.getElementById('mva');
            const reducao = document.getElementById('reducao');
            
            mva.disabled = !temST;
            mva.style.opacity = temST ? "1" : "0.4";
            
            reducao.disabled = !temReducao;
            reducao.style.opacity = temReducao ? "1" : "0.4";
        }

        async function calcular() {
            const status = document.getElementById('statusSrv');
            status.innerText = "Processando...";
            
            const payload = {
                senha: document.getElementById('senha').value,
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                freteEntrada: parseBR(document.getElementById('freteEntrada').value),
                freteSaida: parseBR(document.getElementById('freteSaida').value),
                temST: document.getElementById('temST').checked,
                mva: parseBR(document.getElementById('mva').value),
                temReducao: document.getElementById('temReducao').checked,
                reducao: parseBR(document.getElementById('reducao').value),
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('taxaVista').value),
                taxa12x: parseBR(document.getElementById('taxa12x').value)
            };

            try {
                const response = await fetch('https://lucrum-api.onrender.com/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const res = await response.json();
                
                if (response.status === 401) {
                    alert("Acesso Negado: Senha Incorreta!");
                    status.innerText = "Erro: Senha";
                    return;
                }

                if (res.sucesso) {
                    document.getElementById('vendaVista').innerText = "R$ " + formatBR(res.precoVista);
                    document.getElementById('venda12x').innerText = "R$ " + formatBR(res.preco12x);
                    document.getElementById('lucro12x').innerText = "Lucro: R$ " + formatBR(res.lucroReal);
                    status.innerText = "OK!";
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td class="px-4 py-2.5 text-slate-500">${document.getElementById('codigo').value}</td><td class="px-4 py-2.5 font-bold">${document.getElementById('nome').value}</td><td class="px-4 py-2.5 text-right text-green-400 font-bold">R$ ${formatBR(res.precoVista)}</td><td class="px-4 py-2.5 text-right font-bold">R$ ${formatBR(res.preco12x)}</td><td class="px-4 py-2.5 text-center"><button onclick="this.closest('tr').remove()">✕</button></td>`;
                    document.getElementById('gridCorpo').prepend(tr);
                }
            } catch (e) { status.innerText = "Erro de Conexão"; }
        }

        function mask(i) {
            i.addEventListener('input', (e) => {
                if (i.id === 'codigo' || i.id === 'nome' || i.id === 'senha') return;
                let v = e.target.value.replace(/\D/g, '');
                v = (v / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                e.target.value = v;
            });
        }
        document.querySelectorAll('input').forEach(mask);
    </script>
</body>
</html>
