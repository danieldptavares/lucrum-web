<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrum Pro v4.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; background: #0f172a; border: 1px solid #1e293b; color: white; transition: all 0.2s; font-family: monospace; font-size: 13px; }
        .label-padrao { display: block; text-transform: uppercase; font-size: 9px; color: #64748b; font-weight: bold; }
        body { user-select: text !important; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">📈 Lucrum Pro <span class="text-xs text-blue-400 font-mono">v4.8</span></h1>
            <div id="statusSrv" class="px-3 py-1 bg-slate-800 rounded-full text-[10px] text-blue-400 border border-slate-700">PRONTO</div>
        </div>

        <div class="grid md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 text-slate-400 uppercase text-[10px] border-b border-slate-700 pb-2">📦 Entrada</h2>
                <div class="space-y-3">
                    <input id="codigo" class="input" placeholder="Ref" />
                    <input id="nome" class="input" placeholder="Descrição" />
                    <input id="valor" class="input text-blue-400 font-bold" value="0,00" />
                    <div class="grid grid-cols-2 gap-2">
                        <input id="ipi" class="input" placeholder="IPI%" value="0,00" />
                        <input id="frete" class="input" placeholder="Frete R$" value="0,00" />
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h2 class="mb-4 text-slate-400 uppercase text-[10px] border-b border-slate-700 pb-2">🧾 Fiscal (MG)</h2>
                <div class="space-y-2">
                    <label class="flex justify-between p-2 bg-slate-900 rounded text-[10px]">ST? <input type="checkbox" id="temST" onchange="toggle()"></label>
                    <div id="divMVA" class="hidden"><input id="mva" class="input" placeholder="MVA%" value="0,00"></div>
                    <label class="flex justify-between p-2 bg-slate-900 rounded text-[10px]">Redução? <input type="checkbox" id="temRed" onchange="toggle()"></label>
                    <div id="divRed" class="hidden"><input id="red" class="input" placeholder="Red%" value="0,00"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="inter" value="12,00" class="input text-center" />
                        <input id="intra" value="18,00" class="input text-center" />
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                <h2 class="mb-4 text-slate-400 uppercase text-[10px] border-b border-slate-700 pb-2">📊 Margem</h2>
                <input id="simples" class="input mb-4" placeholder="Simples%" value="0,00" />
                <label class="label-padrao">Margem de Contribuição (%)</label>
                <input id="margem" class="input text-green-400 font-bold" value="0,00" />
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center">
                <h2 class="mb-4 text-orange-400 uppercase text-[10px] border-b border-slate-700 pb-2">💳 Saída</h2>
                <input id="tVista" value="1,37" class="input text-center mb-4" />
                <input id="t12x" value="12,40" class="input text-center" />
            </div>
        </div>

        <div class="mt-6 grid md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <span class="text-[9px] text-slate-500 uppercase">Parcelado 12x</span>
                <p id="res12x" class="text-3xl font-bold font-mono">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center">
                <span class="text-[9px] text-green-500 uppercase">À Vista / PIX</span>
                <p id="resVista" class="text-3xl font-bold text-green-400 font-mono">R$ 0,00</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-blue-500/30 flex flex-col justify-between">
                <input type="password" id="senha" class="input" placeholder="CHAVE DE ACESSO" />
                <button onclick="calcular()" class="mt-3 w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold uppercase text-xs transition-all">Calcular</button>
            </div>
        </div>

        <div class="mt-6 bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
            <table class="w-full text-[11px] text-left">
                <thead class="bg-slate-900 text-slate-500 uppercase">
                    <tr>
                        <th class="p-4">Ref/Produto</th>
                        <th class="p-4 text-right">Custo MG</th>
                        <th class="p-4 text-right">DIFAL/ST</th>
                        <th class="p-4 text-right text-blue-400">Lucro Liq</th>
                        <th class="p-4 text-right text-green-400">À Vista</th>
                        <th class="p-4 text-right">12x</th>
                        <th class="p-4 text-center">🗑️</th>
                    </tr>
                </thead>
                <tbody id="gridCorpo" class="divide-y divide-slate-700/50"></tbody>
            </table>
        </div>
    </div>

    <script>
        const parseBR = (v) => parseFloat(v.replace(/\./g, '').replace(',', '.')) || 0;
        const formatBR = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        function toggle() {
            document.getElementById('divMVA').classList.toggle('hidden', !document.getElementById('temST').checked);
            document.getElementById('divRed').classList.toggle('hidden', !document.getElementById('temRed').checked);
        }

        async function calcular() {
            const status = document.getElementById('statusSrv');
            status.innerText = "...";
            const payload = {
                senha: document.getElementById('senha').value,
                valor: parseBR(document.getElementById('valor').value),
                ipi: parseBR(document.getElementById('ipi').value),
                frete: parseBR(document.getElementById('frete').value),
                temST: document.getElementById('temST').checked,
                mva: parseBR(document.getElementById('mva').value),
                temReducao: document.getElementById('temRed').checked,
                reducao: parseBR(document.getElementById('red').value),
                inter: parseBR(document.getElementById('inter').value),
                intra: parseBR(document.getElementById('intra').value),
                simples: parseBR(document.getElementById('simples').value),
                margem: parseBR(document.getElementById('margem').value),
                taxaVista: parseBR(document.getElementById('tVista').value),
                taxa12x: parseBR(document.getElementById('t12x').value)
            };

            const response = await fetch('https://lucrum-api.onrender.com/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.status === 401) { alert("Senha Errada"); return; }
            const res = await response.json();
            
            if (res.sucesso) {
                document.getElementById('resVista').innerText = "R$ " + formatBR(res.precoVista);
                document.getElementById('res12x').innerText = "R$ " + formatBR(res.preco12x);
                status.innerText = "OK";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-bold">${document.getElementById('nome').value}</td>
                    <td class="p-4 text-right font-mono">R$ ${formatBR(res.custoTotalMG)}</td>
                    <td class="p-4 text-right font-mono text-orange-400">R$ ${formatBR(res.impostoFinal)}</td>
                    <td class="p-4 text-right font-mono text-blue-400">R$ ${formatBR(res.lucroAlvo)}</td>
                    <td class="p-4 text-right font-mono text-green-400 font-bold">R$ ${formatBR(res.precoVista)}</td>
                    <td class="p-4 text-right font-mono font-bold">R$ ${formatBR(res.preco12x)}</td>
                    <td class="p-4 text-center"><button onclick="this.closest('tr').remove()" class="text-slate-500 hover:text-red-500">🗑️</button></td>
                `;
                document.getElementById('gridCorpo').prepend(tr);
            }
        }

        document.querySelectorAll('input').forEach(i => {
            i.addEventListener('input', (e) => {
                if (['codigo','nome','senha'].includes(i.id)) return;
                let v = e.target.value.replace(/\D/g,'');
                e.target.value = (v/100).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
            });
        });
    </script>
</body>
</html>
